spring.main.banner-mode=off
spring.main.web-application-type=none
spring.jmx.enabled=false
jmix.core.available-locales=en
cert.loan-events.topic=jvw-cert-loan-events
cert.loan-events.outbox.poll-delay-ms=3600000
cert.payroll-events.routing-key=jvw-cert-payroll-events
cert.payroll-events.outbox.poll-delay-ms=3600000
cert.loan-consumer.topic=jvw-cert-loan-inbound
cert.loan-consumer.dead-letter-topic=jvw-cert-loan-inbound-dlt
cert.payroll-consumer.queue=jvw-cert-payroll-inbound
cert.payroll-consumer.dead-letter-queue=jvw-cert-payroll-inbound-dlt
cert.sftp.base-path=/upload
cert.hrms.address=http://127.0.0.1:${CERT_WIREMOCK_PORT:58080}/hrms/payroll
cert.hrms.api-key=runtime-certification-secret
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=jvw-cert-inbound-consumers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.missing-topics-fatal=true
spring.rabbitmq.username=jmixintcert
spring.rabbitmq.password=${CERT_RABBIT_PASSWORD:jmix-integration-rabbit}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
logging.level.root=WARN
logging.level.io.jmix=WARN
