# The matrix supplies real credentials through the JavaExec environment.
# Keeping the indexed placeholders here lets the production plugin discover the
# same fixture without committing a secret.
main.datasource.url=${CERT_DB_URL}
main.datasource.username=${CERT_DB_USERNAME}
main.datasource.password=${CERT_DB_PASSWORD}
main.datasource.driver-class-name=${CERT_DB_DRIVER}
main.liquibase.change-log=org/jmixworkbench/certification/runtime/liquibase/changelog.xml
